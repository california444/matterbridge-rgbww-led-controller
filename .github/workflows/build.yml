name: Build

on:
  pull_request:
  workflow_dispatch:
  workflow_call: # from release.yml, before every release

permissions:
  contents: read

jobs:
  test:
    name: Format, lint, typecheck, build, test, audit (Node 26, latest Matterbridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      # Test against the newest Matterbridge release, not only the locked one.
      - name: Install latest Matterbridge
        run: npm install --no-save matterbridge@latest

      - run: npm ls matterbridge

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - run: npm run test:coverage

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # The main job above runs on 26 (current LTS), this one covers the older supported versions.
  test-node:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - run: npm test
